<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Khách Hàng</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>ĐĂNG KÝ TÀI KHOẢN KHÁCH HÀNG</h1>
        
        <form id="registrationForm" novalidate>
            <!-- Mã Khách Hàng -->
            <div class="form-group">
                <label for="maKhachHang">Mã Khách Hàng <span class="required">*</span></label>
                <input type="text" id="maKhachHang" name="maKhachHang" 
                       placeholder="6-10 ký tự, chỉ chữ và số" maxlength="10">
                <span class="error-message" id="maKhachHangError"></span>
            </div>

            <!-- Họ và Tên -->
            <div class="form-group">
                <label for="hoVaTen">Họ và Tên <span class="required">*</span></label>
                <input type="text" id="hoVaTen" name="hoVaTen" 
                       placeholder="Nhập họ tên đầy đủ" maxlength="50">
                <span class="error-message" id="hoVaTenError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" 
                       placeholder="ví dụ: nguyenvana@email.com">
                <span class="error-message" id="emailError"></span>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label for="soDienThoai">Số điện thoại <span class="required">*</span></label>
                <input type="tel" id="soDienThoai" name="soDienThoai" 
                       placeholder="Bắt đầu bằng số 0, 10-12 số" maxlength="12">
                <span class="error-message" id="soDienThoaiError"></span>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label for="diaChi">Địa chỉ <span class="required">*</span></label>
                <textarea id="diaChi" name="diaChi" 
                          placeholder="Nhập địa chỉ chi tiết" maxlength="255" rows="3"></textarea>
                <span class="error-message" id="diaChiError"></span>
            </div>

            <!-- Mật khẩu -->
            <div class="form-group">
                <label for="matKhau">Mật khẩu <span class="required">*</span></label>
                <input type="password" id="matKhau" name="matKhau" 
                       placeholder="Ít nhất 8 ký tự">
                <span class="error-message" id="matKhauError"></span>
            </div>

            <!-- Xác nhận Mật khẩu -->
            <div class="form-group">
                <label for="xacNhanMatKhau">Xác nhận Mật khẩu <span class="required">*</span></label>
                <input type="password" id="xacNhanMatKhau" name="xacNhanMatKhau" 
                       placeholder="Nhập lại mật khẩu">
                <span class="error-message" id="xacNhanMatKhauError"></span>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label for="ngaySinh">Ngày sinh</label>
                <input type="date" id="ngaySinh" name="ngaySinh">
                <span class="error-message" id="ngaySinhError"></span>
            </div>

            <!-- Giới tính -->
            <div class="form-group">
                <label>Giới tính</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="gioiTinh" value="Nam"> Nam
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gioiTinh" value="Nu"> Nữ
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gioiTinh" value="Khac"> Khác
                    </label>
                </div>
            </div>

            <!-- Điều khoản dịch vụ -->
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="dieuKhoan" name="dieuKhoan">
                    Tôi đồng ý với các điều khoản dịch vụ <span class="required">*</span>
                </label>
                <span class="error-message" id="dieuKhoanError"></span>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Đăng ký</button>
                <button type="button" class="btn btn-secondary" id="btnNhapLai">Nhập lại</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
